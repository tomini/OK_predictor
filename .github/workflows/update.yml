name: Update discount data

on:
  schedule:
    # Every hour. Covers midnight CET (22:00 UTC summer, 23:00 UTC winter).
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      manual_date:
        description: 'Date (YYYY-MM-DD) — leave empty to skip manual entry'
        required: false
        default: ''
      manual_discount:
        description: 'Discount description (e.g. SLEVA 30 % NA VŠE SKLADEM)'
        required: false
        default: ''
      manual_code:
        description: 'Discount code (e.g. KOD30VSE)'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run update script
        env:
          MANUAL_DATE: ${{ inputs.manual_date }}
          MANUAL_DISCOUNT: ${{ inputs.manual_discount }}
          MANUAL_CODE: ${{ inputs.manual_code }}
        run: python scripts/update_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "chore: update discount data $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
            git push
          )
